services:
  - type: web
    name: totmart-api
    runtime: docker
    region: singapore
    plan: free
    branch: master
    autoDeploy: true
    healthCheckPath: /api/home/live
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: BCRYPT_COST
        value: '12'
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: '45000'
      - key: MONGO_WAIT_QUEUE_TIMEOUT_MS
        value: '5000'
      - key: MONGO_MAX_COMMIT_TIME_MS
        value: '10000'
      - key: MONGO_TRANSACTION_TIMEOUT_MS
        value: '15000'
      - key: ORDER_EXPIRY_HOURS
        value: '24'
      - key: CHECKOUT_SESSION_EXPIRY_MINUTES
        value: '15'
      - key: REDIS_NAMESPACE
        value: totmart:production
      - key: REDIS_KEEP_ALIVE_MS
        value: '30000'
      - key: REDIS_PING_INTERVAL_MS
        value: '30000'
      # Secrets to be configured in Render Dashboard (sync: false prevents hardcoding secrets into Git)
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEPAY_API_KEY
        sync: false
      - key: SEPAY_BANK_ACCOUNT
        sync: false
      - key: SEPAY_BANK_NAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
