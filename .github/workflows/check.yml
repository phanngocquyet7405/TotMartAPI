name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Real Redis integration (required)
        run: npm test -- --runTestsByPath tests/redisLive.integration.test.js --verbose
        env:
          LOG_LEVEL: silent
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: npm test
        env:
          LOG_LEVEL: silent
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
