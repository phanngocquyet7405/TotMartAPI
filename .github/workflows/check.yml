name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: docker pull redis:7.4-alpine
      - name: Redis HTTP (isolated outage container and disposable Mongo replica set)
        run: npm run test:b01:http
      - name: Full BE regression with coverage baseline
        if: ${{ !cancelled() }}
        run: npm run test:b01
      - name: Upload test and coverage evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-node24-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/b01/
          if-no-files-found: warn
          retention-days: 14
